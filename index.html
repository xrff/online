<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大衍筮法 · 蓍草起卦</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --foreground: #0f172a;
      --background: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --muted-foreground: #64748b;
      --primary: #2563eb;
      --primary-foreground: #ffffff;
      --secondary: #f1f5f9;
      --secondary-foreground: #334155;
      --accent: #0284c7;
      --accent-foreground: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --foreground: #f8fafc;
        --background: #090d16;
        --card: #131b2e;
        --border: #1e293b;
        --muted-foreground: #94a3b8;
        --primary: #3b82f6;
        --primary-foreground: #ffffff;
        --secondary: #1e293b;
        --secondary-foreground: #e2e8f0;
        --accent: #38bdf8;
        --accent-foreground: #0f172a;
      }
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
    }
    .yao-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 24px;
      margin: 8px 0;
    }
    .yang-bar {
      width: 100%;
      height: 12px;
      border-radius: 4px;
    }
    .yin-bar-left, .yin-bar-right {
      width: 44%;
      height: 12px;
      border-radius: 4px;
    }
    .yin-gap {
      width: 12%;
    }
  </style>
</head>
<body class="antialiased p-3 sm:p-6 font-sans min-h-screen">
  <div class="max-w-2xl mx-auto bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-2xl p-5 sm:p-7 shadow-lg">

        </h1>
        <p class="text-xs sm:text-sm text-[var(--muted-foreground)] mt-1">
          「大衍之数五十，其用四十有九。分而为二以象两，挂一以象三，揲之以四以象四时，归奇于扐以象闰。」
        </p>
      </div>
      <span class="whitespace-nowrap flex-shrink-0 self-start sm:self-center text-xs px-3 py-1.5 rounded-full bg-[var(--secondary)] text-[var(--secondary-foreground)] font-mono border border-[var(--border)] font-medium">
        易经古筮法
      </span>
    </div>

    <!-- 问卦输入 -->
    <div class="mb-5">
      <label class="block text-xs font-semibold text-[var(--muted-foreground)] uppercase tracking-wider mb-2">
        所占之事（诚心静虑，心念所求）
      </label>
      <div class="flex gap-2">
        <input id="query-input" type="text" placeholder="例如：某项面试结果 / 工作抉择 / 近期运势吉凶..." 
          class="flex-1 bg-[var(--background)] border border-[var(--border)] rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--primary)] text-[var(--foreground)] placeholder-[var(--muted-foreground)]" />
      </div>
    </div>

    <!-- 操作区 -->
    <div class="flex flex-wrap items-center gap-2.5 mb-6">
      <button id="btn-quick-divine" onclick="quickDivine()" 
        class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium text-sm transition shadow-sm flex items-center gap-1.5 active:scale-95 cursor-pointer">
        <span>⚡</span> 一键推演（十八变）
      </button>
      <button id="btn-step-divine" onclick="stepDivine()"

    </div>

      <div class="flex items-center justify-between text-[var(--muted-foreground)] font-sans text-xs pb-1.5 border-b border-[var(--border)]">
        <span>🌿 揲蓍实时状态</span>
        <span id="current-stage-title" class="text-[var(--foreground)] font-medium">尚未起卦</span>
      </div>
      <div id="process-log" class="text-[var(--muted-foreground)] text-xs leading-relaxed max-h-32 overflow-y-auto">
        点击上方按钮开始推演大衍筮法。大衍之数五十，其用四十有九；三变成一爻，十有八变成一卦。

    </div>

    <!-- 卦象呈现区域 -->

      <!-- 爻象图例 -->

      '110001': { name: '山泽损', desc: '有孚，元吉，无咎，可贞，利有攸往。损己利人，节制欲望，因损得益。' },
      '100011': { name: '风雷益', desc: '利有攸往，利涉大川。损上益下，与时偕行，增益发展。' },
      '111110': { name: '泽天夬', desc: '扬于王庭，孚号有厉。告自邑，不利即戎，利有攸往。决断果敢，除恶务尽。' },
      '011111': { name: '天风姤', desc: '女壮，勿用取女。不期而遇，慎防微杜渐。' },
      '000110': { name: '泽地萃', desc: '亨。王假有庙，利见大人，亨，利贞。荟萃聚集，团结凝聚。' },
      '011000': { name: '地风升', desc: '元亨，用见大人，勿恤，南征吉。积小成大，逐步升进，前途广阔。' },
      '010110': { name: '泽水困', desc: '亨，贞，大人吉，无咎。有言不信。身处困境，坚守操节，终获通达。' },

      '101010': { name: '水火既济', desc: '亨小，利贞。初吉终乱。大功告成，居安思危，防微杜渐。' },
      '010101': { name: '火水未济', desc: '亨，小狐汔济，濡其尾，无攸利。充满生机，万物未央，再接再厉。' }
    };

    function getHexagramInfo(binaryStr) {
      if (HEXAGRAM_DICT[binaryStr]) return HEXAGRAM_DICT[binaryStr];
      const lower = binaryStr.slice(0, 3);
      const upper = binaryStr.slice(3, 6);
      const lowTri = TRIGRAMS[lower] || { name: '卦', nature: '' };
      const upTri = TRIGRAMS[upper] || { name: '卦', nature: '' };
      return {
        name: `${upTri.nature}${lowTri.nature}（${upTri.name}${lowTri.name}）`,
        desc: `上卦为${upTri.name}(${upTri.nature})，下卦为${lowTri.name}(${lowTri.nature})。`
      };
    }

    let currentYaoList = []; 
    let stepCount = 0;      
    let currentStalks = 49;
    let stepLog = [];

    function performOneChange(totalStalks, changeIdx) {
      // 选取模 4 严格均匀分布的切分区间，确保四大爻象数学概率 100% 吻合古代理论值
      const minVal = (totalStalks === 49) ? 5 : 4;
      const maxVal = totalStalks - 5;
      const rangeLen = maxVal - minVal + 1; // 49策->40, 44策->36, 40策->32, 36策->28, 32策->24
      const splitLeft = Math.floor(Math.random() * rangeLen) + minVal;
      const splitRight = totalStalks - splitLeft;
      
      const guaYi = 1;
      const rightMinus = splitRight - guaYi; // 朱熹《筮仪》正轨：自右手地策取一策挂于左手小指
      
      const leftRem = (splitLeft % 4 === 0) ? 4 : (splitLeft % 4);
      const rightRem = (rightMinus % 4 === 0) ? 4 : (rightMinus % 4);
      
      const totalRem = guaYi + leftRem + rightRem;
      const remainingStalks = totalStalks - totalRem;

      return {
        totalBefore: totalStalks,
        splitLeft,
        splitRight,
        guaYi,
        leftRem,
        rightRem,
        totalRem,
        remainingStalks
      };
    }

    function resetDivination() {
      currentYaoList = [];
      stepCount = 0;
      currentStalks = 49;
      stepLog = [];
      document.getElementById('step-count').innerText = '0/18';
      document.getElementById('current-stage-title').innerText = '尚未起卦';
      document.getElementById('process-log').innerHTML = '点击上方按钮开始推演大衍筮法。大衍之数五十，其用四十有九；三变成一爻，十有八变成一卦。';
      document.getElementById('result-area').classList.add('hidden');
    }

    function stepDivine() {
      if (stepCount >= 18) {
        alert('十八变已全部完成！如需重新起卦请点击“清空重演”。');
        return;
      }

      const yaoIdx = Math.floor(stepCount / 3); 
      const changeInYao = (stepCount % 3) + 1;  
      const yaoNames = ['初爻', '二爻', '三爻', '四爻', '五爻', '上爻'];

      if (changeInYao === 1) {
        currentStalks = 49; 
      }

      const res = performOneChange(currentStalks, changeInYao);
      currentStalks = res.remainingStalks;
      stepCount++;

      let logText = `【${yaoNames[yaoIdx]}·第${changeInYao}变】策数${res.totalBefore}根 ➔ 分左${res.splitLeft}右${res.splitRight} ➔ 挂一 ➔ 揲四余左${res.leftRem}右${res.rightRem} ➔ 归奇去${res.totalRem}根 ➔ 余${res.remainingStalks}根`;

      if (changeInYao === 3) {
        const yaoVal = res.remainingStalks / 4; 
        currentYaoList.push(yaoVal);
        const yaoDesc = (yaoVal === 6) ? '老阴 ⚋ (动爻 ✕)' : (yaoVal === 7) ? '少阳 ⚊ (静爻)' : (yaoVal === 8) ? '少阴 ⚋ (静爻)' : '老阳 ⚊ (动爻 ◯)';
        logText += ` <br/><b class="text-blue-600 dark:text-blue-400">➔ 得${yaoNames[yaoIdx]}：${yaoVal} (${yaoDesc})</b>`;
      }

      stepLog.unshift(logText);
      document.getElementById('step-count').innerText = `${stepCount}/18`;
      document.getElementById('current-stage-title').innerText = `正在推演 ${yaoNames[yaoIdx]} 第 ${changeInYao} 变`;
      document.getElementById('process-log').innerHTML = stepLog.slice(0, 8).join('<br/>');

      if (stepCount === 18) {
        finishDivination();
      }
    }

    function quickDivine() {
      resetDivination();
      for (let i = 0; i < 6; i++) {
        let stalks = 49;
        for (let change = 1; change <= 3; change++) {
          const res = performOneChange(stalks, change);
          stalks = res.remainingStalks;
        }
        const yaoVal = stalks / 4;
        currentYaoList.push(yaoVal);
      }
      stepCount = 18;
      document.getElementById('step-count').innerText = '18/18';
      document.getElementById('current-stage-title').innerText = '十八变圆满成卦';
      document.getElementById('process-log').innerHTML = '大衍筮法十八变推演完毕：六爻悉定，阴阳互易。';
      finishDivination();
    }

    function renderYaoLines(yaoList, isOriginal) {
      const yaoNames = ['初', '二', '三', '四', '五', '上'];
      return yaoList.map((val, idx) => {
        let isYang = false;
        let isMoving = (val === 6 || val === 9);

        if (isOriginal) {
          isYang = (val === 7 || val === 9);
        } else {
          if (val === 6) isYang = true; 
          else if (val === 9) isYang = false; 
          else isYang = (val === 7);
        }

        // 颜色定义（兼顾 Standalone Chrome 与 Antigravity 容器环境）
        let colorClass = '';
        let mark = '';

        if (isOriginal) {
          if (val === 9) {
            colorClass = 'bg-amber-500 shadow-sm';
            mark = '<span class="text-amber-500 font-bold text-xs">◯</span>';
          } else if (val === 6) {
            colorClass = 'bg-rose-500 shadow-sm';
            mark = '<span class="text-rose-500 font-bold text-xs">✕</span>';
          } else if (val === 7) {
            colorClass = 'bg-blue-600 dark:bg-blue-400';
          } else {
            colorClass = 'bg-slate-700 dark:bg-slate-300';
          }
        } else {
          colorClass = isYang ? 'bg-blue-600 dark:bg-blue-400' : 'bg-slate-700 dark:bg-slate-300';
        }

        const nameLabel = `${yaoNames[idx]}爻`;

        let lineHtml = '';
        if (isYang) {
          lineHtml = `<div class="yang-bar ${colorClass}"></div>`;
        } else {
          lineHtml = `
            <div class="yin-bar-left ${colorClass}"></div>
            <div class="yin-gap"></div>
            <div class="yin-bar-right ${colorClass}"></div>
          `;
        }

        return `
          <div class="yao-line">
            <span class="text-[11px] text-[var(--muted-foreground)] w-8 text-right font-mono font-medium">${nameLabel}</span>
            <div class="flex-1 flex items-center justify-center">${lineHtml}</div>
            <span class="w-5 text-center flex items-center justify-center">${mark}</span>
          </div>
        `;
      }).join('');
    }

    function finishDivination() {
      const benBinary = currentYaoList.map(v => (v === 7 || v === 9) ? '1' : '0').join('');
      const bianBinary = currentYaoList.map(v => {
        if (v === 6) return '1';
        if (v === 9) return '0';
        return (v === 7) ? '1' : '0';
      }).join('');

      const benGua = getHexagramInfo(benBinary);
      const bianGua = getHexagramInfo(bianBinary);

      document.getElementById('ben-gua-name').innerText = benGua.name;
      document.getElementById('ben-gua-lines').innerHTML = renderYaoLines(currentYaoList, true);
      document.getElementById('ben-gua-desc').innerText = benGua.desc;

      document.getElementById('bian-gua-name').innerText = bianGua.name;
      document.getElementById('bian-gua-lines').innerHTML = renderYaoLines(currentYaoList, false);
      document.getElementById('bian-gua-desc').innerText = bianGua.desc;

      const movingYaoIndices = [];
      currentYaoList.forEach((val, i) => {
        if (val === 6 || val === 9) movingYaoIndices.push(i + 1);
      });

      const yaoNames = ['初', '二', '三', '四', '五', '上'];
      let changeHtml = '';
      let ruleHtml = '';

      if (movingYaoIndices.length === 0) {
        changeHtml = '<p class="text-emerald-600 dark:text-emerald-400">六爻皆静（无变爻）</p>';
        ruleHtml = '<b>【朱熹断法】六爻皆不变：</b> 以本卦卦辞（彖辞）断，体察卦象整体时势与吉凶。';
      } else if (movingYaoIndices.length === 1) {
        const pos = movingYaoIndices[0];
        const val = currentYaoList[pos - 1];
        const type = val === 9 ? '九（老阳 ◯）' : '六（老阴 ✕）';
        changeHtml = `<p class="text-amber-600 dark:text-amber-400">有一爻动：第 ${pos} 爻【${yaoNames[pos - 1]}${type.charAt(0)}】动</p>`;
        ruleHtml = `<b>【朱熹断法】一爻变：</b> 以本卦变爻之爻辞断为主，重点考察本卦第 ${pos} 爻（${yaoNames[pos - 1]}${type.charAt(0)}）的爻辞与吉凶。`;
      } else if (movingYaoIndices.length === 2) {
        changeHtml = `<p class="text-amber-600 dark:text-amber-400">有二爻动：第 ${movingYaoIndices[0]} 爻、第 ${movingYaoIndices[1]} 爻变动</p>`;
        ruleHtml = `<b>【朱熹断法】二爻变：</b> 以本卦两个变爻之爻辞断，而以处于上位者（第 ${movingYaoIndices[1]} 爻）为主。`;
      } else if (movingYaoIndices.length === 3) {
        changeHtml = `<p class="text-amber-600 dark:text-amber-400">有三爻动：第 ${movingYaoIndices.join('、')} 爻变动</p>`;
        ruleHtml = `<b>【朱熹断法】三爻变：</b> 以本卦及之卦之彖辞（卦辞）合参，而以本卦彖辞为主，之卦彖辞为辅。`;
      } else if (movingYaoIndices.length === 4) {
        const still = [1,2,3,4,5,6].filter(x => !movingYaoIndices.includes(x));
        changeHtml = `<p class="text-amber-600 dark:text-amber-400">有四爻动：变爻多，静爻为第 ${still.join('、')} 爻</p>`;
        ruleHtml = `<b>【朱熹断法】四爻变：</b> 以之卦（变卦）中两个不变之爻辞断，并以居下位者（第 ${still[0]} 爻）为主。`;
      } else if (movingYaoIndices.length === 5) {
        const still = [1,2,3,4,5,6].filter(x => !movingYaoIndices.includes(x))[0];
        changeHtml = `<p class="text-amber-600 dark:text-amber-400">有五爻动：仅第 ${still} 爻不变</p>`;
        ruleHtml = `<b>【朱熹断法】五爻变：</b> 以之卦（变卦）中唯一不变的那一爻辞断（第 ${still} 爻）。`;
      } else if (movingYaoIndices.length === 6) {
        changeHtml = '<p class="text-rose-600 dark:text-rose-400">六爻皆动（乾坤看用，他卦看之卦）</p>';
        if (benBinary === '111111') {
          ruleHtml = '<b>【朱熹断法】乾卦六爻皆变：</b> 乾卦用九，“见群龙无首，吉”，以“用九”爻辞断。';
        } else if (benBinary === '000000') {
          ruleHtml = '<b>【朱熹断法】坤卦六爻皆变：</b> 坤卦用六，“利永贞”，以“用六”爻辞断。';
        } else {
          ruleHtml = '<b>【朱熹断法】六爻皆变：</b> 以之卦（变卦）之彖辞（卦辞）断。';
        }
      }

      document.getElementById('change-analysis').innerHTML = changeHtml;
      document.getElementById('rule-guide').innerHTML = ruleHtml;
      document.getElementById('result-area').classList.remove('hidden');
    }

    let copyTimer = null;
    function copyResultForChat() {
      const query = document.getElementById('query-input').value.trim() || '未填写问事';
      const benGuaName = document.getElementById('ben-gua-name').innerText;
      const bianGuaName = document.getElementById('bian-gua-name').innerText;
      const yaoNames = ['初', '二', '三', '四', '五', '上'];
      
      const yaoDetails = currentYaoList.map((v, i) => {
        const tag = (v === 6) ? '老阴 ⚋ ✕（变阳）' : (v === 7) ? '少阳 ⚊（不变）' : (v === 8) ? '少阴 ⚋（不变）' : '老阳 ⚊ ◯（变阴）';
        return `${yaoNames[i]}爻：${v} [${tag}]`;
      }).join('\n');

      const text = `【大衍筮法·蓍草起卦结果】\n问事：${query}\n本卦：${benGuaName}\n之卦：${bianGuaName}\n六爻数值（由下至上）：\n${yaoDetails}\n\n请帮我结合《周易》卦辞、爻辞与朱熹占法，深入解读这个卦象的寓意与启示。`;

      const btn = document.getElementById('copy-btn');
      
      const onCopySuccess = () => {
        if (copyTimer) clearTimeout(copyTimer);
        btn.innerHTML = '<span>✅</span> 已复制到剪贴板！可直接粘贴到对话框';
        copyTimer = setTimeout(() => {
          btn.innerHTML = '<span>📋</span> 复制完整卦象（发给 AI 深入解卦）';
          copyTimer = null;
        }, 2500);
      };

      const onCopyFallback = () => {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          const successful = document.execCommand('copy');
          document.body.removeChild(textarea);
          if (successful) {
            onCopySuccess();
          } else {
            prompt('请手动复制以下卦象内容：', text);
          }
        } catch (err) {
          prompt('请手动复制以下卦象内容：', text);
        }
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text)
          .then(onCopySuccess)
          .catch(() => onCopyFallback());
      } else {
        onCopyFallback();
      }
    }
  </script>
</body>
