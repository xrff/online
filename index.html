<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大衍筮法 · 蓍草起卦</title>
<style>
:root{--fg:#0f172a;--bg:#f8fafc;--card:#fff;--bd:#e2e8f0;--muted:#64748b;
--pri:#2563eb;--pri-fg:#fff;--sec:#f1f5f9;--sec-fg:#334155;--yang:#2563eb;--yin:#475569;
--amber:#e8890c;--rose:#e11d48;--ok:#059669}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf8;--bg:#090d16;--card:#131b2e;--bd:#1e293b;
--muted:#94a3b8;--sec:#1e293b;--sec-fg:#e2e8f0;--yang:#60a5fa;--yin:#cbd5e1;--amber:#f5a623;--rose:#fb7185;--ok:#34d399}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);
font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
-webkit-font-smoothing:antialiased}
.card{max-width:780px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:16px;
padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.06)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;
border-bottom:1px solid var(--bd);padding-bottom:14px;margin-bottom:18px}
h1{font-size:20px;margin:0;letter-spacing:.5px}
.sub{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.badge{font-size:11px;font-family:ui-monospace,Menlo,monospace;padding:4px 10px;border-radius:99px;
background:var(--sec);color:var(--sec-fg);border:1px solid var(--bd);white-space:nowrap}
.field{display:block;margin-bottom:16px}
.field span{display:block;font-size:11px;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);
color:var(--fg);font-size:14px;outline:none}
input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--bd);background:var(--sec);color:var(--sec-fg);padding:9px 14px;border-radius:10px;
font-size:13px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.btn:hover{opacity:.85}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}
.btn.ghost{background:transparent;color:var(--muted);border-color:transparent;margin-left:auto}
.btn.copy{background:#0284c7;color:#fff;border-color:#0284c7}
.hint{font-size:11.5px;color:var(--muted);margin:10px 0 18px}
.board{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.board-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);
border-bottom:1px solid var(--bd);padding-bottom:6px;margin-bottom:8px}
.board-head b{color:var(--fg);font-weight:600}
.log{font:11.5px/1.7 ui-monospace,Menlo,monospace;color:var(--muted);max-height:220px;overflow:auto;
white-space:pre-wrap}
.log .hot{color:var(--pri);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.gua{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px}
.gua-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--muted);
letter-spacing:1px;margin-bottom:10px}
.gua-head b{font-size:15px;color:var(--fg);letter-spacing:0}
.lines{padding:2px 4px}
.yao{display:flex;align-items:center;gap:10px;height:22px;margin:5px 0}
.yao .lbl{width:26px;text-align:right;font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
.yao .mk{width:16px;font-size:11px;text-align:center;color:var(--amber)}
.yao .mk.x{color:var(--rose)}
.bar{flex:1;height:10px;border-radius:3px}
.bar.yang{background:var(--yang)}
.bar.yin{background:transparent;display:flex;gap:18%}
.bar.yin i{flex:1;background:var(--yin);border-radius:3px}
.yao.moving .bar.yang{background:var(--amber)}
.yao.moving .bar.yin i{background:var(--rose)}
.ci{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--bd);font-size:13px;line-height:1.7}
.xiang{margin:4px 0 0;font-size:12px;color:var(--muted)}
.rule{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:16px}
.rule h2{font-size:12px;letter-spacing:1px;color:var(--muted);margin:0 0 8px;font-weight:600}
#change-summary{font-size:14px;font-weight:600;color:var(--fg);margin-bottom:8px}
.rulebox{font-size:12.5px;color:var(--muted);line-height:1.8;margin-bottom:10px}
.yaobox{display:flex;flex-direction:column;gap:6px}
.yao-ci{font-size:14px;line-height:1.75;padding:8px 10px;background:var(--card);border:1px solid var(--bd);
border-radius:8px}
.yao-ci .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:99px;background:var(--pri);
color:var(--pri-fg);margin-right:6px;vertical-align:1px}
.yao-ci .tag.aux{background:var(--sec);color:var(--sec-fg)}
.yao-ci .who{color:var(--muted);font-size:12px;margin-right:4px}
.foot{display:flex;justify-content:flex-end}
.notice{margin-top:14px;font-size:11px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main class="card">
  <header>
    <div>
      <h1>🌿 大衍筮法 · 蓍草起卦</h1>
      <p class="sub">「大衍之数五十，其用四十有九。分而为二以象两，挂一以象三，揲之以四以象四时，归奇于扐以象闰。」</p>
    </div>
    <span class="badge" id="cast-time">未起卦</span>
  </header>

  <label class="field">
    <span>所占之事（诚心静虑，心念所求）</span>
    <input id="query-input" type="text" placeholder="例如：某项面试结果 / 工作抉择 / 租赁续约…">
  </label>

  <div class="actions">
    <button id="btn-quick" class="btn primary">⚡ 一键推演（十八变）</button>
    <button id="btn-step" class="btn">🔄 单步揲蓍（<span id="step-count">0/18</span>）</button>
    <button id="btn-reset" class="btn ghost">清空重演</button>
  </div>
  <p class="hint">一事一占；得卦之后不宜反复重摇。《蒙》曰：「初筮告，再三渎，渎则不告。」</p>

  <section class="board">
    <div class="board-head"><span>🌿 揲蓍过程</span><b id="stage-title">尚未起卦</b></div>
    <div id="process-log" class="log">点击上方按钮开始推演。大衍之数五十，其用四十有九；三变成一爻，十有八变成一卦。</div>
  </section>

  <section id="result" hidden>
    <div class="grid">
      <article class="gua">
        <div class="gua-head"><span>本 卦</span><b id="ben-name">--</b></div>
        <div id="ben-lines" class="lines"></div>
        <p id="ben-ci" class="ci"></p>
        <p id="ben-xiang" class="xiang"></p>
      </article>
      <article class="gua">
        <div class="gua-head"><span>之 卦</span><b id="bian-name">--</b></div>
        <div id="bian-lines" class="lines"></div>
        <p id="bian-ci" class="ci"></p>
        <p id="bian-xiang" class="xiang"></p>
      </article>
    </div>

    <section class="rule">
      <h2>📜 变爻与断法（朱熹《易学启蒙·考变占》）</h2>
      <div id="change-summary"></div>
      <div id="rule-text" class="rulebox"></div>
      <div id="yao-text" class="yaobox"></div>
    </section>

    <div class="foot">
      <button id="btn-copy" class="btn copy">📋 复制卦象与爻辞（发给 AI 解卦）</button>
    </div>
  </section>

  <p class="notice">数据：《周易》经文（卦辞、爻辞、象曰）· 断法：朱熹《易学启蒙·考变占》。不保存任何记录，刷新即清空。</p>
</main>
<script>
const GUA = {"111111":{"name":"乾为天","ci":"元亨。利贞。","xiang":"天行健，君子以自强不息。","yao":["初九：潜龙勿用。","九二：见龙在田，利见大人。","九三：君子终日乾乾，夕惕若；厉，无咎。","九四：或跃在渊，无咎。","九五：飞龙在天，利见大人。","上九：亢龙，有悔。"],"yong":"用九：见群龙无首，吉。"},"000000":{"name":"坤为地","ci":"元亨。利牝马之贞。君子有攸往，先迷后得主。利西南得朋，东北丧朋。安贞，吉。","xiang":"地势坤，君子以厚德载物。","yao":["初六：履霜，坚冰至。","六二：直方大，不习无不利。","六三：含章，可贞。或从王事，无成有终。","六四：括囊，无咎无誉。","六五：黄裳，元吉。","上六：龙战于野，其血玄黄。"],"yong":"用六：利永贞。"},"100010":{"name":"水雷屯","ci":"元亨，利贞。勿用有攸往，利建侯。","xiang":"云雷，屯；君子以经纶。","yao":["初九：磐桓，利居贞，利建侯。","六二：屯如邅如，乘马班如，匪寇婚媾，女子贞不字，十年乃字。","六三：即鹿无虞，惟入于林中，君子几不如舍，往吝。","六四：乘马班如，求婚媾，往，吉无不利。","九五：屯其膏；小贞吉，大贞凶。","上六：乘马班如，泣血涟如。"],"yong":null},"010001":{"name":"山水蒙","ci":"亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。","xiang":"山下出泉，蒙；君子以果行育德。","yao":["初六：发蒙，利用刑人，用说桎梏，以往吝。","九二：包蒙吉，纳妇吉，子克家。","六三：勿用取女，见金夫，不有躬，无攸利。","六四：困蒙，吝。","六五：童蒙，吉。","上九：击蒙，不利为寇，利御寇。"],"yong":null},"111010":{"name":"水天需","ci":"有孚，光亨。贞吉，利涉大川。","xiang":"云上于天，需；君子以饮食宴乐。","yao":["初九：需于郊，利用恒，无咎。","九二：需于沙，小有言，终吉。","九三：需于泥，致寇至。","六四：需于血，出自穴。","九五：需于酒食，贞吉。","上六：入于穴，有不速之客三人来，敬之终吉。"],"yong":null},"010111":{"name":"天水讼","ci":"有孚，窒，惕，中吉，终凶。利见大人，不利涉大川。","xiang":"天与水违行，讼；君子以作事谋始。","yao":["初六：不永所事，小有言，终吉。","九二：不克讼，归而逋，其邑人三百户无眚。","六三：食旧德，贞厉，终吉。或从王事，无成。","九四：不克讼，复即命渝，安贞吉。","九五：讼，元吉。","上九：或锡之鞶带，终朝三褫之。"],"yong":null},"010000":{"name":"地水师","ci":"贞丈人吉，无咎。","xiang":"地中有水，师；君子以容民畜众。","yao":["初六：师出以律，否臧，凶。","九二：在师中吉，无咎；王三锡命。","六三：师或舆尸，凶。","六四：师左次，无咎。","六五：田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。","上六：大君有命，开国承家，小人勿用。"],"yong":null},"000010":{"name":"水地比","ci":"吉。原筮元永贞，无咎。不宁方来，后夫凶。","xiang":"地上有水，比；先王以建万国，亲诸侯。","yao":["初六：有孚，比之，无咎。有孚盈缶，终来有它，吉。","六二：比之自内，贞吉。","六三：比之匪人。","六四：外比之，贞吉。","九五：显比。王用三驱，失前禽，邑人不诫，吉。","上六：比之无首，凶。"],"yong":null},"111011":{"name":"风天小畜","ci":"亨。密云不雨，自我西郊。","xiang":"风行天上，小畜，君子以懿文德。","yao":["初九：复自道，何其咎，吉。","九二：牵复，吉。","九三：舆说辐，夫妻反目。","六四：有孚，血去惕出，无咎。","九五：有孚挛如，富以其邻。","上九：既雨既处，尚德载，妇贞厉，月几望，君子征凶。"],"yong":null},"110111":{"name":"天泽履","ci":"履虎尾，不咥人，亨。","xiang":"上天下泽，履；君子以辨上下，定民志。","yao":["初九：素履，往无咎。","九二：履道坦坦，幽人贞吉。","六三：眇能视，跛能履，履虎尾，咥人，凶。武人为于大君。","九四：履虎尾，愬愬终吉。","九五：夬履，贞厉。","上九：视履考详，其旋元吉。"],"yong":null},"111000":{"name":"地天泰","ci":"小往大来，吉亨。","xiang":"天地交，泰；后以财成天地之道，辅相天地之宜，以左右民。","yao":["初九：拔茅茹以其汇，征吉。","九二：包荒。用冯河，不遐遗；朋亡。得尚于中行。","九三：无平不陂，无往不复，艰贞无咎。勿恤其孚，于食有福。","六四：翩翩，不富以其邻；不戒以孚。","六五：帝乙归妹，以祉，元吉。","上六：城复于隍，勿用师，自邑告命，贞吝。"],"yong":null},"000111":{"name":"天地否","ci":"否之匪人，不利君子贞，大往小来。","xiang":"天地不交，否；君子以俭德辟难，不可荣以禄。","yao":["初六，拔茅茹以其汇，贞吉。亨。","六二，包承，小人吉，大人否。亨。","六三，包羞。","九四，有命，无咎，畴离祉。","九五，休否，大人吉。其亡其亡，系于}{另|包|苞}}桑。","上九，倾否，先否后喜。"],"yong":null},"101111":{"name":"天火同人","ci":"同人于野，亨。 利涉大川，利君子贞。","xiang":"天与火，同人；君子以类族辨物。","yao":["初九：同人于门，无咎。","六二：同人于宗，吝。","九三：伏戎于莽，升其高陵，三岁不兴。","九四：乘其墉，弗克攻，吉。","九五：同人，先号啕而后笑。大师克相遇。","上九：同人于郊，无悔。"],"yong":null},"111101":{"name":"火天大有","ci":"元亨。","xiang":"火在天上，大有；君子以遏恶扬善，顺天休命。","yao":["初九：无交害，匪咎，艰则无咎。","九二：大车以载，有攸往，无咎。","九三：公用亨于天子，小人弗克。","九四：匪其彭，无咎。","六五：厥孚交如，威如；吉。","上九：自天佑之，吉无不利。"],"yong":null},"001000":{"name":"地山谦","ci":"亨，君子有终。","xiang":"地中有山，谦；君子以裒多益寡，称物平施。","yao":["初六：谦谦君子，用涉大川，吉。","六二：鸣谦，贞吉。","九三：劳谦君子，有终吉。","六四：无不利，㧑谦。","六五：不富，以其邻，利用侵伐，无不利。","上六：鸣谦，利用行师，征邑国。"],"yong":null},"000100":{"name":"雷地豫","ci":"利建侯行师。","xiang":"雷出地奋，豫。先王以作乐崇德，殷荐之上帝，以配祖考。","yao":["初六：鸣豫，凶。","六二：介于石，不终日，贞吉。","六三：盱豫，悔。迟有悔。","九四：由豫，大有得。勿疑。朋盍簪。","六五：贞疾，恒不死。","上六：冥豫，成有渝，无咎。"],"yong":null},"100110":{"name":"泽雷随","ci":"元亨。利贞。无咎。","xiang":"泽中有雷，随；君子以向晦入宴息。","yao":["初九：官有渝，贞吉。出门交有功。","六二：系小子，失丈夫。","六三：系丈夫，失小子。随，有求得利，居贞。","九四：随有获，贞凶。有孚在道，以明，何咎。","九五：孚于嘉，吉。","上六：拘系之，乃从维之。王用亨于西山。"],"yong":null},"011001":{"name":"山风蛊","ci":"元亨。利涉大川。先甲三日，后甲三日。","xiang":"山下有风，蛊；君子以振民育德。","yao":["初六：干父之蛊，有子考，无咎，厉终吉。","九二：干母之蛊，不可贞。","九三：干父之蛊，小有悔，无大咎。","六四：裕父之蛊，往见吝。","六五：干父之蛊，用誉。","上九：不事王侯，高尚其事。"],"yong":null},"110000":{"name":"地泽临","ci":"元亨。利贞。至于八月有凶。","xiang":"泽上有地，临；君子以教思无穷，容保民无疆。","yao":["初九：咸临，贞吉。","九二：咸临，吉无不利。","六三：甘临，无攸利。既忧之，无咎。","六四：至临，无咎。","六五：知临，大君之宜，吉。","上六：敦临，吉无咎。"],"yong":null},"000011":{"name":"风地观","ci":"盥而不荐，有孚颙若。","xiang":"风行地上，观；先王以省方，观民设教。","yao":["初六：童观，小人无咎，君子吝。","六二：窥观，利女贞。","六三：观我生，进退。","六四：观国之光，利用宾于王。","九五：观我生，君子无咎。","上九：观其生，君子无咎。"],"yong":null},"100101":{"name":"火雷噬嗑","ci":"亨。利用狱。","xiang":"雷电噬嗑；先王以明罚敕法。","yao":["初九：屦校灭趾，无咎。","六二：噬肤灭鼻，无咎。","六三：噬腊肉，遇毒；小吝，无咎。","九四：噬乾胏，得金矢，利艰贞，吉。","六五：噬乾肉，得黄金，贞厉，无咎。","上九：何校灭耳，凶。"],"yong":null},"101001":{"name":"山火贲","ci":"亨。小利有攸往。","xiang":"山下有火，贲；君子以明庶政，无敢折狱。","yao":["初九：贲其趾，舍车而徒。","六二：贲其须。","九三：贲如濡如，永贞吉。","六四：贲如皤如，白马翰如，匪寇婚媾。","六五：贲于丘园，束帛戋戋，吝，终吉。","上九：白贲，无咎。"],"yong":null},"000001":{"name":"山地剥","ci":"不利有攸往。","xiang":"山附地上，剥；上以厚下，安宅。","yao":["初六：剥床以足，蔑贞凶。","六二：剥床以辨，蔑贞凶。","六三：剥之，无咎。","六四：剥床以肤，凶。","六五：贯鱼，以宫人宠，无不利。","上九：硕果不食，君子得舆，小人剥庐。"],"yong":null},"100000":{"name":"地雷复","ci":"亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。","xiang":"雷在地中，复；先王以至日闭关，商旅不行，后不省方。","yao":["初九：不远复，无祇悔，元吉。","六二：休复，吉。","六三：频复，厉无咎。","六四：中行独复。","六五：敦复，无悔。","上六：迷复，凶，有灾眚。用行师，终有大败，以其国君，凶；至于十年，不克征。"],"yong":null},"100111":{"name":"天雷无妄","ci":"元亨。利贞。其匪正有眚，不利有攸往。","xiang":"天下雷行，物与无妄；先王以茂对时，育万物。","yao":["初九：无妄，往吉。","六二：不耕获，不菑畬，则利有攸往。","六三：无妄之灾，或系之牛，行人之得，邑人之灾。","九四：可贞，无咎。","九五：无妄之疾，勿药有喜。","上九：无妄，行有眚，无攸利。"],"yong":null},"111001":{"name":"山天大畜","ci":"利贞，不家食吉，利涉大川。","xiang":"天在山中，大畜；君子以多识前言往行，以畜其德。","yao":["初九：有厉利已。","九二：舆说輹。","九三：良马逐，利艰贞，吉。日闲舆卫，利有攸往。","六四：童牛之牿，元吉。","六五：豮豕之牙，吉。","上九：何天之衢，亨。"],"yong":null},"100001":{"name":"山雷颐","ci":"贞吉。观颐，自求口实。","xiang":"山下有雷，颐；君子以慎言语，节饮食。","yao":["初九：舍尔灵龟，观我朵颐，凶。","六二：颠颐，拂经，于丘颐，征凶。","六三：拂颐，贞凶，十年勿用，无攸利。","六四：颠颐吉，虎视眈眈，其欲逐逐，无咎。","六五：拂经，居贞吉，不可涉大川。","上九：由颐，厉吉，利涉大川。"],"yong":null},"011110":{"name":"泽风大过","ci":"栋桡，利有攸往，亨。","xiang":"泽灭木，大过。君子以独立不惧，遁世无闷。","yao":["初六：藉用白茅，无咎。","九二：枯杨生稊，老夫得其女妻，无不利。","九三：栋桡，凶。","九四：栋隆，吉。有它吝。","九五：枯杨生华，老妇得其士夫，无咎无誉。","上六：过涉灭顶，凶，无咎。"],"yong":null},"010010":{"name":"坎为水","ci":"习坎，有孚，维心亨，行有尚。","xiang":"水洊至，习坎；君子以常德行，习教事。","yao":["初六：习坎，入于坎窞，凶。","九二：坎有险，求小得。","六三：来之坎坎，险且枕，入于坎窞，勿用。","六四：樽酒簋贰，用缶，纳约自牖，终无咎。","九五：坎不盈，祗既平，无咎。","上六：系用徽𬙊，寘于丛棘，三岁不得，凶。"],"yong":null},"101101":{"name":"离为火","ci":"利贞。亨。畜牝牛，吉。","xiang":"明两作离，大人以继明照于四方。","yao":["初九：履错然，敬之无咎。","六二：黄离，元吉。","九三：日昃之离，不鼓缶而歌，则大耋之嗟，凶。","九四：突如其来如，焚如，死如，弃如。","六五：出涕沱若，戚嗟若，吉。","上九：王用出征，有嘉折首，获匪其丑，无咎。"],"yong":null},"001110":{"name":"泽山咸","ci":"亨。利贞。取女吉。","xiang":"山上有泽，咸；君子以虚受人。","yao":["初六：咸其拇。","六二：咸其腓，凶，居吉。","九三：咸其股，执其随，往吝。","九四：贞吉悔亡，憧憧往来，朋从尔思。","九五：咸其脢，无悔。","上六：咸其辅，颊，舌。"],"yong":null},"011100":{"name":"雷风恒","ci":"亨，无咎。利贞，利有攸往。","xiang":"雷风，恒；君子以立不易方。","yao":["初六：浚恒，贞凶，无攸利。","九二：悔亡。","九三：不恒其德，或承之羞，贞吝。","九四：田无禽。","六五：恒其德，贞，妇人吉，夫子凶。","上六：振恒，凶。"],"yong":null},"001111":{"name":"天山遁","ci":"亨。小利贞。","xiang":"天下有山，遁；君子以远小人，不恶而严。","yao":["初六：遁尾，厉，勿用有攸往。","六二：执之用黄牛之革，莫之胜说。","九三：系遁，有疾厉，畜臣妾吉。","九四：好遁君子吉，小人否。","九五：嘉遁，贞吉。","上九：肥遁，无不利。"],"yong":null},"111100":{"name":"雷天大壮","ci":"利贞。","xiang":"雷在天上，大壮；君子以非礼弗履。","yao":["初九：壮于趾，征凶，有孚。","九二：贞吉。","九三：小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。","九四：贞吉悔亡，藩决不羸，壮于大舆之輹。","六五：丧羊于易，无悔。","上六：羝羊触藩，不能退，不能遂，无攸利，艰则吉。"],"yong":null},"000101":{"name":"火地晋","ci":"康侯用锡马蕃庶，昼日三接。","xiang":"明出地上，晋；君子以自昭明德。","yao":["初六：晋如，摧如，贞吉。罔孚，裕无咎。","六二：晋如，愁如，贞吉。受兹介福，于其王母。","六三：众允，悔亡。","九四：晋如鼫鼠，贞厉。","六五：悔亡，失得勿恤，往吉无不利。","上九：晋其角，维用伐邑，厉吉无咎，贞吝。"],"yong":null},"101000":{"name":"地火明夷","ci":"利艰贞。","xiang":"明入地中，明夷；君子以莅众，用晦而明。","yao":["初九：明夷于飞，垂其翼。君子于行，三日不食，有攸往，主人有言。","六二：明夷，夷于左股，用拯马壮，吉。","九三：明夷于南狩，得其大首，不可疾贞。","六四：入于左腹，获明夷之心，于出门庭。","六五：箕子之明夷，利贞。","上六：不明晦，初登于天，后入于地。"],"yong":null},"101011":{"name":"风火家人","ci":"利女贞。","xiang":"风自火出，家人；君子以言有物，而行有恒。","yao":["初九：闲有家，悔亡。","六二：无攸遂，在中馈，贞吉。","九三：家人嗃嗃，悔厉吉；妇子嘻嘻，终吝。","六四：富家，大吉。","九五：王假有家，勿恤。吉。","上九：有孚威如，终吉。"],"yong":null},"110101":{"name":"火泽睽","ci":"小事吉。","xiang":"上火下泽，睽；君子以同而异。","yao":["初九：悔亡，丧马勿逐，自复；见恶人无咎。","九二：遇主于巷，无咎。","六三：见舆曳，其牛掣，其人天且劓，无初有终。","九四：睽孤，遇元夫，交孚，厉无咎。","六五：悔亡，厥宗噬肤，往何咎。","上九：睽孤， 见豕负涂，载鬼一车， 先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。"],"yong":null},"001010":{"name":"水山蹇","ci":"利西南，不利东北；利见大人，贞吉。","xiang":"山上有水，蹇；君子以反身修德。","yao":["初六：往蹇，来誉。","六二：王臣蹇蹇，匪躬之故。","九三：往蹇来反。","六四：往蹇来连。","九五：大蹇朋来。","上六：往蹇来硕，吉；利见大人。"],"yong":null},"010100":{"name":"雷水解","ci":"利西南，无所往，其来复吉。有攸往，夙吉。","xiang":"雷雨作，解；君子以赦过宥罪。","yao":["初六：无咎。","九二：田获三狐，得黄矢，贞吉。","六三：负且乘，致寇至，贞吝。","九四：解而拇，朋至斯孚。","六五：君子维有解，吉；有孚于小人。","上六：公用射隼，于高墉之上，获之，无不利。"],"yong":null},"110001":{"name":"山泽损","ci":"有孚，元吉。无咎，可贞，利有攸往。曷之用？二簋可用享。","xiang":"山下有泽，损；君子以惩忿窒欲。","yao":["初九：已事遄往，无咎，酌损之。","九二：利贞，征凶，弗损益之。","六三：三人行，则损一人；一人行，则得其友。","六四：损其疾，使遄有喜，无咎。","六五：或益之，十朋之龟弗克违，元吉。","上九：弗损益之，无咎，贞吉，利有攸往，得臣无家。"],"yong":null},"100011":{"name":"风雷益","ci":"利有攸往。利涉大川。","xiang":"风雷，益；君子以见善则迁，有过则改。","yao":["初九：利用为大作，元吉，无咎。","六二：或益之，十朋之龟弗克违，永贞吉。王用享于帝，吉。","六三：益之用凶事，无咎。有孚中行，告公用圭。","六四：中行，告公从。利用为依迁国。","九五：有孚惠心，勿问元吉。有孚惠我德。","上九：莫益之，或击之，立心勿恒，凶。"],"yong":null},"111110":{"name":"泽天夬","ci":"扬于王庭，孚号，有厉，告自邑，不利即戎，利有攸往。","xiang":"泽上于天，夬；君子以施禄及下，居德则忌。","yao":["初九：壮于前趾，往不胜为咎。","九二：惕号，莫夜有戎，勿恤。","九三：壮于頄，有凶。君子夬夬，独行遇雨，若濡有愠，无咎。","九四：臀无肤，其行次且。牵羊悔亡，闻言不信。","九五：苋陆夬夬，中行无咎。","上六：无号，终有凶。"],"yong":null},"011111":{"name":"天风姤","ci":"女壮，勿用取女。","xiang":"天下有风，姤；后以施命诰四方。","yao":["初六：系于金柅，贞吉，有攸往，见凶，羸豕，孚，蹢躅。","九二：包有鱼，无咎，不利宾。","九三：臀无肤，其行次且，厉，无大咎。","九四：包无鱼，起凶。","九五：以杞包瓜，含章，有陨自天。","上九：姤其角，吝，无咎。"],"yong":null},"000110":{"name":"泽地萃","ci":"王假有庙，利见大人，亨。利贞。用大牲吉，利有攸往。","xiang":"泽上于地，萃；君子以除戎器，戒不虞。","yao":["初六：有孚不终，乃乱乃萃，若号一握为笑，勿恤，往无咎。","六二：引吉，无咎，孚乃利用禴。","六三：萃如，嗟如，无攸利，往无咎，小吝。","九四：大吉，无咎。","九五：萃有位，无咎。匪孚，元永贞，悔亡。","上六：赍咨涕洟，无咎。"],"yong":null},"011000":{"name":"地风升","ci":"元亨，用见大人，勿恤，南征吉。","xiang":"地中生木，升；君子以顺德，积小以高大。","yao":["初六：允升，大吉。","九二：孚乃利用禴，无咎。","九三：升虚邑。","六四：王用亨于岐山，吉无咎。","六五：贞吉，升阶。","上六：冥升，利于不息之贞。"],"yong":null},"010110":{"name":"泽水困","ci":"亨，贞大人吉，无咎，有言不信。","xiang":"泽无水，困；君子以致命遂志。","yao":["初六：臀困于株木，入于幽谷，三岁不觌。","九二：困于酒食，朱绂方来，利用亨祀，征凶，无咎。","六三：困于石，据于蒺藜，入于其宫，不见其妻，凶。","九四：来徐徐，困于金车，吝，有终。","九五：劓刖，困于赤绂，乃徐有说，利用祭祀。","上六：困于葛藟，于臲卼，曰动悔。有悔，征吉。"],"yong":null},"011010":{"name":"水风井","ci":"改邑不改井，无丧无得，往来井井。汔至亦未繘井。羸其瓶，凶。","xiang":"木上有水，井；君子以劳民劝相。","yao":["初六：井泥不食，旧井无禽。","九二：井谷射鲋，瓮敝漏。","九三：井渫不食，为我心恻，可用汲，王明，并受其福。","六四：井甃，无咎。","九五：井冽，寒泉食。","上六：井收勿幕，有孚元吉。"],"yong":null},"101110":{"name":"泽火革","ci":"已日乃孚，元亨。利贞。悔亡。","xiang":"泽中有火，革；君子以治历明时。","yao":["初九：巩用黄牛之革。","六二：已日乃革之，征吉，无咎。","九三：征凶，贞厉，革言三就，有孚。","九四：悔亡，有孚改命，吉。","九五：大人虎变，未占有孚。","上六：君子豹变，小人革面，征凶，居贞吉。"],"yong":null},"011101":{"name":"火风鼎","ci":"元吉，亨。","xiang":"木上有火，鼎；君子以正位凝命。","yao":["初六：鼎颠趾，利出否，得妾以其子，无咎。","九二：鼎有实，我仇有疾，不我能即，吉。","九三：鼎耳革，其行塞，雉膏不食，方雨亏悔，终吉。","九四：鼎折足，覆公𫗧，其形渥，凶。","六五：鼎黄耳金铉，利贞。","上九：鼎玉铉，大吉，无不利。"],"yong":null},"100100":{"name":"震为雷","ci":"亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。","xiang":"洊雷，震；君子以恐惧修省。","yao":["初九：震来虩虩，后笑言哑哑，吉。","六二：震来厉，亿丧贝，跻于九陵，勿逐，七日得。","六三：震苏苏，震行无眚。","九四：震遂泥。","六五：震往来厉，亿无丧，有事。","上六：震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。"],"yong":null},"001001":{"name":"艮为山","ci":"艮其背，不获其身，行其庭，不见其人，无咎。","xiang":"兼山，艮；君子以思不出其位。","yao":["初六：艮其趾，无咎，利永贞。","六二：艮其腓，不拯其随，其心不快。","九三：艮其限，裂其夤，厉熏心。","六四：艮其身，无咎。","六五：艮其辅，言有序，悔亡。","上九：敦艮，吉。"],"yong":null},"001011":{"name":"风山渐","ci":"女归吉，利贞。","xiang":"山上有木，渐；君子以居贤德，善俗。","yao":["初六：鸿渐于干，小子厉，有言，无咎。","六二：鸿渐于磐，饮食衎衎，吉。","九三：鸿渐于陆，夫征不复，妇孕不育，凶；利御寇。","六四：鸿渐于木，或得其桷，无咎。","九五：鸿渐于陵，妇三岁不孕，终莫之胜，吉。","上九：鸿渐于陆，其羽可用为仪，吉。"],"yong":null},"110100":{"name":"雷泽归妹","ci":"征凶，无攸利。","xiang":"泽上有雷，归妹；君子以永终知敝。","yao":["初九：归妹以娣，跛能履，征吉。","九二：眇能视，利幽人之贞。","六三：归妹以须，反归以娣。","九四：归妹愆期，迟归有时。","六五：帝乙归妹，其君之袂，不如其娣之袂良，月几望，吉。","上六：女承筐无实，士刲羊无血，无攸利。"],"yong":null},"101100":{"name":"雷火丰","ci":"亨。王假之，勿忧，宜日中。","xiang":"雷电皆至，丰；君子以折狱致刑。","yao":["初九：遇其配主，虽旬无咎，往有尚。","六二：丰其蔀，日中见斗，往得疑疾，有孚发若，吉。","九三：丰其沛，日中见沬，折其右肱，无咎。","九四：丰其蔀，日中见斗，遇其夷主，吉。","六五：来章，有庆誉，吉。","上六：丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。"],"yong":null},"001101":{"name":"火山旅","ci":"小亨，旅贞吉。","xiang":"山上有火，旅；君子以明慎用刑，而不留狱。","yao":["初六：旅琐琐，斯其所取灾。","六二：旅即次，怀其资，得童仆贞。","九三：旅焚其次，丧其童仆，贞厉。","九四：旅于处，得其资斧，我心不快。","六五：射雉一矢亡，终以誉命。","上九：鸟焚其巢，旅人先笑后号咷。丧牛于易，凶。"],"yong":null},"011011":{"name":"巽为风","ci":"小亨。利有攸往。利见大人。","xiang":"随风，巽；君子以申命行事。","yao":["初六：进退，利武人之贞。","九二：巽在床下，用史巫纷若，吉无咎。","九三：频巽，吝。","六四：悔亡，田获三品。","九五：贞吉悔亡，无不利。无初有终，先庚三日，后庚三日，吉。","上九：巽在床下，丧其资斧，贞凶。"],"yong":null},"110110":{"name":"兑为泽","ci":"亨。利贞。","xiang":"丽泽，兑；君子以朋友讲习。","yao":["初九：和兑，吉。","九二：孚兑，吉，悔亡。","六三：来兑，凶。","九四：商兑，未宁，介疾有喜。","九五：孚于剥，有厉。","上六：引兑。"],"yong":null},"010011":{"name":"风水涣","ci":"亨，王假有庙，利涉大川，利贞。","xiang":"风行水上，涣；先王以享于帝立庙。","yao":["初六：用拯马壮，吉，悔亡。","九二：涣奔其机，悔亡。","六三：涣其躬，无悔。","六四：涣其群，元吉。涣有丘，匪夷所思。","九五：涣汗其大号，涣王居，无咎。","上九：涣其血，去逖出，无咎。"],"yong":null},"110010":{"name":"水泽节","ci":"亨。苦节不可贞。","xiang":"泽上有水，节；君子以制数度，议德行。","yao":["初九：不出户庭，无咎。","九二：不出门庭，凶。","六三：不节若，则嗟若，无咎。","六四：安节，亨。","九五：甘节，吉；往有尚。","上六：苦节，贞凶，悔亡。"],"yong":null},"110011":{"name":"风泽中孚","ci":"豚鱼吉，利涉大川，利贞。","xiang":"泽上有风，中孚；君子以议狱缓死。","yao":["初九：虞吉，有它不燕。","九二：鸣鹤在阴，其子和之，我有好爵，吾与尔靡之。","六三：得敌，或鼓或罢，或泣或歌。","六四：月几望，马匹亡，无咎。","九五：有孚挛如，无咎。","上九：翰音登于天，贞凶。"],"yong":null},"001100":{"name":"雷山小过","ci":"亨。利贞。可小事，不可大事。飞鸟遗之音，不宜上宜下，大吉。","xiang":"山上有雷，小过；君子以行过乎恭，丧过乎哀，用过乎俭。","yao":["初六：飞鸟以凶。","六二：过其祖，遇其妣；不及其君，遇其臣；无咎。","九三：弗过防之，从或戕之，凶。","九四：无咎，弗过遇之。往厉必戒，勿用永贞。","六五：密云不雨，自我西郊，公弋取彼在穴。","上六：弗遇过之，飞鸟离之，凶，是谓灾眚。"],"yong":null},"101010":{"name":"水火既济","ci":"亨小。利贞。初吉终乱。","xiang":"水在火上，既济；君子以思患而豫防之。","yao":["初九：曳其轮，濡其尾，无咎。","六二：妇丧其茀，勿逐，七日得。","九三：高宗伐鬼方，三年克之，小人勿用。","六四：𦈡有衣袽，终日戒。","九五：东邻杀牛，不如西邻之禴祭，实受其福。","上六：濡其首，厉。"],"yong":null},"010101":{"name":"火水未济","ci":"亨。小狐汔济，濡其尾，无攸利。","xiang":"火在水上，未济；君子以慎辨物居方。","yao":["初六：濡其尾，吝。","九二：曳其轮，贞吉。","六三：未济，征凶，利涉大川。","九四：贞吉，悔亡，震用伐鬼方，三年有赏于大国。","六五：贞吉，无悔，君子之光，有孚，吉。","上九：有孚于饮酒，无咎，濡其首，有孚失是。"],"yong":null}};
const LINE_NAMES = ['初','二','三','四','五','上'];
const $ = id => document.getElementById(id);

let yaoVals = [], stepCount = 0, currentStalks = 49, logs = [], castTime = null;

function rnd(n) {
  if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
    const a = new Uint32Array(1);
    const limit = 4294967296 - (4294967296 % n);
    let x;
    do { crypto.getRandomValues(a); x = a[0]; } while (x >= limit);
    return x % n;
  }
  return Math.floor(Math.random() * n);
}

function oneChange(total) {
  const minVal = (total === 49) ? 5 : 4;
  const maxVal = total - 5;
  const splitLeft = rnd(maxVal - minVal + 1) + minVal;
  const splitRight = total - splitLeft;
  const rightMinus = splitRight - 1;
  const leftRem = (splitLeft % 4 === 0) ? 4 : splitLeft % 4;
  const rightRem = (rightMinus % 4 === 0) ? 4 : rightMinus % 4;
  const totalRem = 1 + leftRem + rightRem;
  return { totalBefore: total, splitLeft, splitRight, leftRem, rightRem,
           totalRem, remaining: total - totalRem };
}

function yaoType(v) {
  return v === 9 ? '老阳 ⚊ ◯（变阴）' : v === 6 ? '老阴 ⚋ ✕（变阳）'
       : v === 7 ? '少阳 ⚊（不变）' : '少阴 ⚋（不变）';
}
function yaoName(i) {
  const v = yaoVals[i];
  const yy = (v === 9 || v === 7) ? '九' : '六';
  if (i === 0) return '初' + yy;
  if (i === 5) return '上' + yy;
  return yy + LINE_NAMES[i];
}
function splitYao(s) {
  const k = s.indexOf('：');
  return k < 0 ? { name: '', text: s } : { name: s.slice(0, k), text: s.slice(k + 1) };
}

function reset() {
  yaoVals = []; stepCount = 0; currentStalks = 49; logs = []; castTime = null;
  $('step-count').textContent = '0/18';
  $('stage-title').textContent = '尚未起卦';
  $('cast-time').textContent = '未起卦';
  $('process-log').textContent = '点击上方按钮开始推演。大衍之数五十，其用四十有九；三变成一爻，十有八变成一卦。';
  $('result').hidden = true;
}

function renderLog() {
  const box = $('process-log');
  box.innerHTML = logs.map(l => l.replace(/➔ 得(\d+)（(.+)）$/, '➔ <span class="hot">得$1（$2）</span>')).join('\n');
}

function doChange(silent) {
  const yaoIdx = Math.floor(stepCount / 3);
  const changeNo = (stepCount % 3) + 1;
  if (changeNo === 1) currentStalks = 49;
  const r = oneChange(currentStalks);
  currentStalks = r.remaining;
  stepCount++;
  let line = `【${LINE_NAMES[yaoIdx]}·第${changeNo}变】${r.totalBefore} 策 ➔ 左${r.splitLeft} 右${r.splitRight}`
           + ` ➔ 挂一 ➔ 揲四余 左${r.leftRem} 右${r.rightRem} ➔ 去${r.totalRem} ➔ 余${r.remaining}`;
  if (changeNo === 3) {
    const v = r.remaining / 4;
    yaoVals.push(v);
    line += ` ➔ 得${v}（${yaoType(v)}）`;
  }
  logs.unshift(line);
  if (!silent) {
    renderLog();
    $('step-count').textContent = stepCount + '/18';
    $('stage-title').textContent = `正在推演 ${LINE_NAMES[yaoIdx]} 第 ${changeNo} 变`;
  }
}

function stamp() {
  if (!castTime) {
    castTime = new Date();
    $('cast-time').textContent = fmt(castTime);
  }
}
function fmt(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function quickDivine() {
  reset(); stamp();
  for (let i = 0; i < 18; i++) doChange(true);
  stepCount = 18;
  renderLog();
  $('step-count').textContent = '18/18';
  $('stage-title').textContent = '十八变圆满成卦';
  finish();
}

function stepDivine() {
  if (stepCount >= 18) { $('stage-title').textContent = '十八变已毕，请「清空重演」'; return; }
  stamp();
  doChange(false);
  if (stepCount === 18) { $('stage-title').textContent = '十八变圆满成卦'; finish(); }
}

function linesHtml(vals, moving, changed) {
  return vals.map((v, i) => {
    const yang = (v === 7 || v === 9);
    const mv = moving && moving.has(i);
    const mark = (!changed && mv) ? (v === 9 ? '○' : '✕') : '';
    const bar = yang ? '<i class="bar yang"></i>' : '<i class="bar yin"><i></i><i></i></i>';
    return `<div class="yao${mv && !changed ? ' moving' : ''}"><span class="lbl">${LINE_NAMES[i]}</span>${bar}`
         + `<span class="mk${v === 6 ? ' x' : ''}">${mark}</span></div>`;
  }).join('');
}

function finish() {
  const benBin = yaoVals.map(v => (v === 7 || v === 9) ? '1' : '0').join('');
  const bianVals = yaoVals.map(v => v === 6 ? 7 : v === 9 ? 8 : v);
  const bianBin = bianVals.map(v => (v === 7 || v === 9) ? '1' : '0').join('');
  const ben = GUA[benBin], bian = GUA[bianBin];
  const moving = new Set();
  yaoVals.forEach((v, i) => { if (v === 6 || v === 9) moving.add(i); });

  $('ben-name').textContent = ben.name;
  $('ben-lines').innerHTML = linesHtml(yaoVals, moving, false);
  $('ben-ci').textContent = ben.ci;
  $('ben-xiang').textContent = ben.xiang ? '象曰：' + ben.xiang : '';
  $('bian-name').textContent = bian.name;
  $('bian-lines').innerHTML = linesHtml(bianVals, moving, true);
  $('bian-ci').textContent = bian.ci;
  $('bian-xiang').textContent = bian.xiang ? '象曰：' + bian.xiang : '';

  const mv = [...moving].sort((a, b) => a - b);
  const n = mv.length;
  let summary = '', rule = '', list = [];
  const add = (tag, name, text, aux) => list.push({ tag, name, text, aux: !!aux });
  const itemBen = (i, main) => { const y = splitYao(ben.yao[i]); add(main ? '主' : '辅', y.name, y.text, !main); };
  const itemBian = (i, main) => { const y = splitYao(bian.yao[i]); add(main ? '主' : '辅', y.name, y.text, !main); };

  if (n === 0) {
    summary = '六爻皆静';
    rule = '【朱熹断法】六爻皆不变：以本卦卦辞（彖辞）断，体察卦象整体时势。';
    add('主', '本卦卦辞', ben.ci);
  } else if (n === 1) {
    summary = `一爻动：${yaoName(mv[0])}`;
    rule = '【朱熹断法】一爻变：以本卦变爻之爻辞断。';
    itemBen(mv[0], true);
  } else if (n === 2) {
    summary = `二爻动：${yaoName(mv[0])}、${yaoName(mv[1])}`;
    rule = `【朱熹断法】二爻变：以本卦两变爻之爻辞断，仍以上位者（${yaoName(mv[1])}）为主。`;
    itemBen(mv[1], true);
    itemBen(mv[0], false);
  } else if (n === 3) {
    summary = `三爻动：${mv.map(i => yaoName(i)).join('、')}`;
    rule = '【朱熹断法】三爻变：以本卦及之卦之卦辞合参，而以本卦为主。';
    add('主', '本卦卦辞', ben.ci);
    add('辅', '之卦卦辞', bian.ci, true);
  } else if (n === 4) {
    const still = [0, 1, 2, 3, 4, 5].filter(i => !moving.has(i));
    summary = `四爻动：仅 ${still.map(i => LINE_NAMES[i]).join('、')} 不变`;
    rule = `【朱熹断法】四爻变：以之卦两不变爻之爻辞断，以下位者（${LINE_NAMES[still[0]]}爻）为主。`;
    itemBian(still[0], true);
    itemBian(still[1], false);
  } else if (n === 5) {
    const still = [0, 1, 2, 3, 4, 5].filter(i => !moving.has(i))[0];
    summary = `五爻动：仅 ${LINE_NAMES[still]} 爻不变`;
    rule = '【朱熹断法】五爻变：以之卦唯一不变之爻的爻辞断。';
    itemBian(still, true);
  } else {
    summary = '六爻皆动';
    if (benBin === '111111') {
      rule = '【朱熹断法】乾卦六爻皆变：以「用九」断。';
      const y = splitYao(ben.yong); add('主', y.name, y.text);
    } else if (benBin === '000000') {
      rule = '【朱熹断法】坤卦六爻皆变：以「用六」断。';
      const y = splitYao(ben.yong); add('主', y.name, y.text);
    } else {
      rule = '【朱熹断法】六爻皆变：以之卦卦辞断。';
      add('主', '之卦卦辞', bian.ci);
    }
  }

  $('change-summary').textContent = summary;
  $('rule-text').textContent = rule;
  $('yao-text').innerHTML = list.map(it =>
    `<div class="yao-ci"><span class="tag${it.aux ? ' aux' : ''}">${it.tag}</span><span class="who">${it.name}</span>${it.text}</div>`
  ).join('');
  $('result').hidden = false;
  window.__state = { ben, bian, mv, castTime, summary, rule, list };
  window.__lines = { ben: benBin, bian: bianBin };
}

function copyResult() {
  const st = window.__state; if (!st) return;
  const q = $('query-input').value.trim() || '未填写问事';
  const vals = yaoVals.map((v, i) => `${LINE_NAMES[i]}爻：${v} [${yaoType(v)}]`).join('\n');
  const items = st.list.map(it => `${it.tag}：${it.name}　${it.text}`).join('\n');
  const text = `【大衍筮法·蓍草起卦结果】\n起卦时间：${st.castTime ? fmt(st.castTime) : '未记录'}\n问事：${q}\n`
    + `本卦：${st.ben.name}\n之卦：${st.bian.name}\n六爻数值（由下至上）：\n${vals}\n\n`
    + `断法（${st.summary}）：${st.rule}\n${items}\n\n`
    + `请帮我结合《周易》卦辞、爻辞与朱熹占法，深入解读这个卦象的寓意与启示。`;
  const btn = $('btn-copy');
  const done = () => { btn.textContent = '✅ 已复制'; setTimeout(() => btn.textContent = '📋 复制卦象与爻辞（发给 AI 解卦）', 2200); };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); done();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}

$('btn-quick').addEventListener('click', quickDivine);
$('btn-step').addEventListener('click', stepDivine);
$('btn-reset').addEventListener('click', reset);
$('btn-copy').addEventListener('click', copyResult);
</script>
</body>
</html>
